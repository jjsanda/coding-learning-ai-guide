apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clag.fullname" . }}-api
  labels:
    {{- include "clag.labels" . | nindent 4 }}
---
# The API may only manage sandbox Jobs in the sandbox namespace — nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "clag.fullname" . }}-sandbox
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "clag.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "clag.fullname" . }}-sandbox
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "clag.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "clag.fullname" . }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "clag.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
