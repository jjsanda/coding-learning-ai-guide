apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clag.fullname" . }}-web
  labels:
    {{- include "clag.labels" . | nindent 4 }}
    codeguide.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      codeguide.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        codeguide.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "clag.image" (dict "registry" .Values.image.registry "image" .Values.web.image "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clag.fullname" . }}-web
  labels:
    {{- include "clag.labels" . | nindent 4 }}
    codeguide.io/component: web
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    codeguide.io/component: web
  ports:
    - port: 80
      targetPort: 80
