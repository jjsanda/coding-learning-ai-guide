{{- if .Values.sandbox.gvisor.enabled }}
# Registers the gVisor RuntimeClass. This assumes the gVisor runtime (runsc)
# and containerd handler are already installed on the nodes — see
# docs/deployment.md. Sandbox Jobs opt in via runtimeClassName.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.sandbox.gvisor.runtimeClassName }}
  labels:
    {{- include "clag.labels" . | nindent 4 }}
handler: {{ .Values.sandbox.gvisor.runtimeClassName }}
{{- end }}
