apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "clag.labels" . | nindent 4 }}
    codeguide.io/role: sandbox
---
# Default-deny: sandbox pods get no ingress and no egress. Results flow back to
# the API through pod logs, so the sandbox never needs a network socket.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-deny-all
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "clag.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
