apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clag.fullname" . }}-api
  labels:
    {{- include "clag.labels" . | nindent 4 }}
    codeguide.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      codeguide.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        codeguide.io/component: api
    spec:
      serviceAccountName: {{ include "clag.fullname" . }}-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "clag.image" (dict "registry" .Values.image.registry "image" .Values.api.image "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CODEGUIDE_EXECUTION_BACKEND
              value: kubernetes
            - name: CODEGUIDE_K8S_SANDBOX_NAMESPACE
              value: {{ .Values.sandbox.namespace }}
            - name: CODEGUIDE_K8S_ACTIVE_DEADLINE_S
              value: {{ .Values.sandbox.activeDeadlineSeconds | quote }}
            - name: CODEGUIDE_SANDBOX_WALL_TIMEOUT_S
              value: {{ .Values.sandbox.wallTimeoutSeconds | quote }}
            - name: CODEGUIDE_SANDBOX_MEMORY_MB
              value: {{ .Values.sandbox.memoryMb | quote }}
            - name: CODEGUIDE_SANDBOX_CPUS
              value: {{ .Values.sandbox.cpus | quote }}
            - name: CODEGUIDE_WORKER_CONCURRENCY
              value: {{ .Values.api.workerConcurrency | quote }}
            - name: CODEGUIDE_RUNNER_IMAGE_PYTHON
              value: {{ include "clag.image" (dict "registry" .Values.image.registry "image" .Values.runners.python "tag" .Values.image.tag) }}
            - name: CODEGUIDE_RUNNER_IMAGE_NODE
              value: {{ include "clag.image" (dict "registry" .Values.image.registry "image" .Values.runners.node "tag" .Values.image.tag) }}
            - name: CODEGUIDE_K8S_RUNNER_PULL_POLICY
              value: {{ .Values.image.pullPolicy }}
            {{- if .Values.sandbox.gvisor.enabled }}
            - name: CODEGUIDE_K8S_GVISOR_RUNTIME_CLASS
              value: {{ .Values.sandbox.gvisor.runtimeClassName }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: CODEGUIDE_DATABASE_URL
              value: postgresql+asyncpg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "clag.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}
            {{- end }}
          {{- if .Values.api.llmSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.llmSecretName }}
          {{- end }}
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clag.fullname" . }}-api
  labels:
    {{- include "clag.labels" . | nindent 4 }}
    codeguide.io/component: api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    codeguide.io/component: api
  ports:
    - port: 8000
      targetPort: 8000
---
# Short alias so the web pod's nginx (proxy_pass http://api:8000) resolves the
# API in-cluster, matching the docker-compose service name.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "clag.labels" . | nindent 4 }}
    codeguide.io/component: api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    codeguide.io/component: api
  ports:
    - port: 8000
      targetPort: 8000
