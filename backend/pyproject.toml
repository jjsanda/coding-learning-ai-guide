[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codeguide"
version = "0.1.0"
description = "AI code review and formative feedback engine for programming courses"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Josef Sanda" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "docker>=7.1",
    "kubernetes>=30.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jjsanda/coding-learning-ai-guide"
Issues = "https://github.com/jjsanda/coding-learning-ai-guide/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeguide"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (flake8-bandit)
    "C90",      # mccabe complexity
    "RUF",
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and dummy credentials are fine in tests
# demo_content holds deliberately vulnerable sample submissions as string data
"src/codeguide/demo_content.py" = ["S105", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["codeguide"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # the ORM model TestResult is imported into test modules; it is not a test class
    "ignore:cannot collect test class 'TestResult'::",
]
markers = [
    "integration: needs Docker and built runner images",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/codeguide"]
