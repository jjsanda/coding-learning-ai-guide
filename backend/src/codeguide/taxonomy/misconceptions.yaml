# Misconception taxonomy: maps analyzer rule IDs to the underlying concept a
# student is likely missing. The instructor dashboard aggregates THESE tags —
# deterministic analyzer output — never text generated by a language model.
#
# tag: a stable identifier surfaced in the dashboard
# title: short human-readable name
# rules: analyzer rule IDs (bandit test IDs, semgrep rule IDs, ruff/eslint codes)

misconceptions:
  - tag: sql-injection
    title: Building SQL from user input
    summary: >-
      Concatenating or formatting user input into SQL text lets that input
      rewrite the query. Queries and data must travel separately
      (parameterized queries).
    rules:
      - B608                    # bandit: hardcoded_sql_expressions
      - py-sqli-fstring
      - py-sqli-format
      - js-sqli-template

  - tag: hardcoded-secret
    title: Secrets written into source code
    summary: >-
      Passwords and API keys in source end up in version control and every
      copy of the code. Secrets belong in the environment or a vault.
    rules:
      - B105                    # bandit: hardcoded_password_string
      - B106
      - B107
      - py-hardcoded-password
      - js-hardcoded-secret

  - tag: unsafe-deserialization
    title: Loading untrusted serialized data
    summary: >-
      Formats like pickle can run code while loading. Untrusted data needs a
      data-only format such as JSON.
    rules:
      - B301                    # bandit: pickle
      - B506                    # bandit: yaml_load
      - py-unsafe-pickle
      - py-unsafe-yaml-load

  - tag: eval-injection
    title: Turning data into code with eval
    summary: >-
      eval/exec make whoever controls the input the author of your program.
      Data should be parsed, not executed.
    rules:
      - B307                    # bandit: eval
      - py-eval-input
      - js-eval
      - no-eval
      - no-implied-eval
      - no-new-func
      - security/detect-eval-with-expression

  - tag: command-injection
    title: Building shell commands from input
    summary: >-
      Passing user input through a shell lets special characters become
      commands. Programs should be executed with explicit argument lists.
    rules:
      - B602                    # bandit: subprocess_popen_with_shell_equals_true
      - B604
      - B605                    # bandit: start_process_with_a_shell
      - py-subprocess-shell
      - js-child-process-injection
      - security/detect-child-process

  - tag: xss
    title: Injecting raw HTML into the page
    summary: >-
      Inserting user text as markup lets users inject scripts into other
      people's browsers. Text should be added as text, not HTML.
    rules:
      - js-inner-html

  - tag: weak-randomness
    title: Predictable randomness for secrets
    summary: >-
      Standard random generators are predictable; anything security-related
      needs a cryptographic source of randomness.
    rules:
      - B311                    # bandit: random
      - js-insecure-random-for-secrets
      - security/detect-pseudoRandomBytes

  - tag: disabled-tls-verification
    title: Turning off certificate checks
    summary: >-
      Disabling TLS verification silently allows man-in-the-middle
      interception of "secure" connections.
    rules:
      - B501                    # bandit: request_with_no_cert_validation
      - py-requests-verify-false

  - tag: excessive-complexity
    title: Functions that try to do everything
    summary: >-
      Very branchy functions are hard to test, debug and extend. Smaller
      functions with one job each are easier to get right.
    rules:
      - radon-cc-C
      - radon-cc-D
      - radon-cc-E
      - radon-cc-F
      - C901                    # ruff: mccabe complexity
      - complexity
      - max-depth
      - max-lines-per-function

  - tag: mutable-default-argument
    title: Mutable default arguments
    summary: >-
      Default values are created once, not per call — a mutable default is
      shared between every call of the function.
    rules:
      - B006                    # ruff bugbear: mutable-argument-default

  - tag: undefined-name
    title: Using names that don't exist
    summary: >-
      Referencing a variable or function that was never defined (often a typo
      or a scoping misunderstanding) crashes the program at runtime.
    rules:
      - F821                    # ruff: undefined-name
      - no-undef

  - tag: infinite-loop
    title: Programs that never finish
    summary: >-
      A loop whose exit condition can never become true (or is never updated)
      runs forever. Every loop needs a provable way to end.
    rules:
      - test-timeout

  - tag: loose-equality
    title: Loose equality comparisons
    summary: >-
      JavaScript's == coerces types in surprising ways; === says what you
      mean.
    rules:
      - eqeqeq
